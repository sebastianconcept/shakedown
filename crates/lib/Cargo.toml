[package]
name = "shakedown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Progressive confidence testing for Rust backend services — real infrastructure, structured evidence, safe to ship."
readme = "README.md"
repository = "https://github.com/sebastianconcept/shakedown"
homepage = "https://shakedown.dev"
license = "MIT"
keywords = ["testing", "integration-testing", "kafka", "postgres", "testcontainers"]
categories = ["development-tools::testing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Procedural macros (greeting smoke test; macros milestone will expand usage)
shakedown-macros = { path = "../macros" }

# Error handling and serialization
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
displaydoc = "0.2"
time = { version = "0.3", default-features = false, features = ["formatting"] }

# Tokio async executor (public async lifecycle API)
tokio = { version = "1", features = ["fs", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
# `FutureExt::catch_unwind` so run_scenario still merges load/cluster/fault events if the scenario panics
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Kafka integration (optional; enable the `kafka` Cargo feature)
# `tokio` enables `FutureProducer` + `AsyncRuntime` (helpers and mock services use async send).
rdkafka = { version = "=0.38", optional = true, default-features = false, features = ["ssl-vendored", "tokio"] }

# Testcontainers (Docker / OCI container engine)
testcontainers = { version = "0.27", default-features = false, optional = true }

# Community images (enable per parent feature: `kafka`, `postgres`, …)
testcontainers-modules = { version = "0.15", default-features = false, optional = true }

# Async Postgres client for admin/readiness queries (no sqlx in public API)
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["runtime", "with-uuid-1", "with-time-0_3"] }

# Async MySQL/MariaDB protocol for admin/readiness queries (sqlx is not part of the public API)
mysql_async = { version = "0.36.1", optional = true }

# SQLite for in-memory per-scenario resources (no Docker; rusqlite + spawn_blocking)
rusqlite = { version = "0.32", optional = true, default-features = false, features = ["bundled"] }

# Optional sqlx pools + migrate! Migrator integration (`sqlx` feature; pairs with `postgres` / `sqlite`)
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "macros", "migrate", "postgres", "sqlite", "mysql"] }

# Redis / Valkey async client (`redis` / `valkey` features; RESP)
redis = { version = "1.1", optional = true, default-features = false, features = ["tokio-comp", "streams"] }

# MongoDB official async driver (`mongodb` feature)
mongodb = { version = "3.4", optional = true }

# NATS async client (`nats` feature)
async-nats = { version = "0.46", optional = true }

# Neo4j Bolt client (`neo4j` feature)
neo4rs = { version = "0.8", optional = true }

# RabbitMQ client for readiness and publication verification (`rabbitmq` feature)
lapin = { version = "4.3", optional = true }

# Toxiproxy control API for fault injection; enable via `fault-injection`
noxious-client = { version = "1.0", optional = true }
# GET /version readiness for Toxiproxy (same major as noxious-client’s reqwest)
reqwest = { version = "0.11", optional = true, default-features = false, features = ["json", "rustls-tls"] }
percent-encoding = { version = "2", optional = true }

# Docker Engine API (read-only observability; feature `diagnostics`)
# Align with testcontainers' bollard to avoid duplicate bollard-stubs versions in the lockfile.
bollard = { version = "0.20", optional = true, default-features = false, features = ["ssl"] }
# Structured logging for diagnostics and future tracing layer hooks.
tracing = "0.1"

# HTTP mock services (`mvp-mock-services`; hyper 1.x + http 1.x)
hyper = { version = "1", optional = true, default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["tokio"] }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# gRPC mock services (optional; tonic aligns with lockfile via testcontainers stack)
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport"] }
prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true, default-features = false }
tower = { version = "0.5", optional = true, default-features = false, features = ["util"] }

# DuckDB in-process per-scenario resource (no Docker; duckdb + spawn_blocking)
duckdb = { version = "1", default-features = false, features = ["bundled"], optional = true }
qdrant-client = { version = "1.17", optional = true, default-features = false }

# HdrHistogram for load metrics and windowed percentiles (`load` feature)
hdrhistogram = { version = "7", optional = true }

# Kafka KRaft multi-broker cluster id generation (`kafka-cluster` feature)
uuid = { version = "1", optional = true, features = ["v4"] }
base64 = { version = "0.22", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
rdkafka = { version = "=0.38", default-features = false, features = ["ssl-vendored", "tokio"] }
async-nats = "0.46"
async-trait = "0.1"
bytes = "1"
bollard = { version = "0.20", default-features = false, features = ["ssl"] }
lapin = { version = "4.3" }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serial_test = "3"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Unary gRPC client for `mock_service_grpc` integration test (no codegen; uses `tonic_prost::ProstCodec`).
http = "1"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tonic-prost = "0.14"

[features]
# HTTP mock service types and `hyper` stack (default-on per `mvp-mock-services` milestone)
default = ["mock-services"]
mock-services = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
]
grpc-mock-services = [
    "mock-services",
    "dep:tonic",
    "dep:prost",
    "dep:tokio-stream",
    "dep:tower",
]
# Infrastructure diagnostics (bollard); implied by Docker-backed resource features unless `no-diagnostics` is set
diagnostics = ["dep:bollard"]
# Disables Docker socket diagnostics at compile time (stub APIs; no bollard client)
no-diagnostics = []
# Kafka integration with real infrastructure (requires Docker)
# Includes: rdkafka, testcontainers, diagnostics (bollard)
kafka = [
    "dep:rdkafka",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/kafka",
    "diagnostics",
]
# Multi-broker KRaft cluster on a shared Docker network
kafka-cluster = [
    "kafka",
    "cluster",
    "dep:uuid",
    "dep:base64",
    "shakedown-macros/kafka-cluster",
]
# Postgres integration with real infrastructure (requires Docker)
postgres = [
    "dep:tokio-postgres",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/postgres",
    "diagnostics",
]
# PostgreSQL primary + streaming replica per scenario
postgres-cluster = [
    "postgres",
    "cluster",
    "shakedown-macros/postgres-cluster",
]
# MariaDB integration with real infrastructure (requires Docker)
mariadb = [
    "dep:mysql_async",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/mariadb",
    "diagnostics",
]
# Oracle MySQL integration with real infrastructure (requires Docker; distinct from MariaDB — R-8)
mysql = [
    "dep:mysql_async",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/mysql",
    "diagnostics",
]
# In-memory SQLite per scenario (no Docker)
sqlite = ["dep:rusqlite"]
# sqlx pools and `impl MigrationRunner for sqlx::migrate::Migrator<…>` (use with `postgres` and/or `sqlite`)
sqlx = ["dep:sqlx"]
# In-process DuckDB per scenario (no Docker; no diagnostics)
duckdb = ["dep:duckdb"]
# Outbox helpers (requires at least one relational feature)
outbox = []
# RabbitMQ integration (Docker + lapin; aligns with kafka: diagnostics via testcontainers)
rabbitmq = [
    "dep:lapin",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/rabbitmq",
    "diagnostics",
]
# RabbitMQ Erlang cluster + quorum default queue type
rabbitmq-cluster = [
    "rabbitmq",
    "cluster",
    "dep:uuid",
    "dep:reqwest",
    "dep:percent-encoding",
    "shakedown-macros/rabbitmq-cluster",
]
# Fault injection (Toxiproxy via testcontainers + noxious-client); composable with `kafka` etc.
fault-injection = [
    "dep:noxious-client",
    "dep:reqwest",
    "dep:testcontainers",
]
# Redis (Docker + redis crate; suite-shared broker)
redis = [
    "dep:redis",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/redis",
    "diagnostics",
]
# Valkey (Docker + redis crate; suite-shared server; shared types with `redis` feature)
valkey = [
    "dep:redis",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/valkey",
    "diagnostics",
]
# Redis primary + replicas + Sentinel on a suite bridge (`redis` + `cluster`)
redis-sentinel = [
    "redis",
    "redis?/sentinel",
    "cluster",
    "shakedown-macros/redis-sentinel",
]
# MongoDB (`mongo` image via testcontainers-modules)
mongodb = [
    "dep:mongodb",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/mongo",
    "diagnostics",
]
# MongoDB replica set (multi-container, bridge network + `replSetInitiate`; `mongodb` + `cluster`)
mongodb-cluster = [
    "mongodb",
    "cluster",
    "shakedown-macros/mongodb-cluster",
]
# NATS core pub/sub (`nats` image via testcontainers-modules)
nats = [
    "dep:async-nats",
    "dep:bytes",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/nats",
    "diagnostics",
]
# Neo4j 5.x Enterprise default (`neo4j:5-enterprise`); per-scenario databases via CREATE DATABASE
neo4j = [
    "dep:neo4rs",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/neo4j",
    "diagnostics",
]
# Elasticsearch 8.x (docker.elastic.co image via testcontainers-modules; HTTP via reqwest only, no official client crate)
elasticsearch = [
    "dep:reqwest",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/elastic_search",
    "shakedown-macros/elasticsearch",
    "diagnostics",
]
# OpenSearch 2.x (opensearchproject/opensearch via GenericImage; HTTP via reqwest only)
opensearch = [
    "dep:reqwest",
    "dep:testcontainers",
    "shakedown-macros/opensearch",
    "diagnostics",
]
# Qdrant vector DB (GenericImage `qdrant/qdrant`; gRPC helpers via qdrant-client)
qdrant = [
    "dep:qdrant-client",
    "dep:reqwest",
    "dep:testcontainers",
    "shakedown-macros/qdrant",
    "diagnostics",
]
# Weaviate (`semitechnologies/weaviate` via GenericImage; tag aligned with testcontainers-modules/weaviate)
weaviate = [
    "dep:reqwest",
    "dep:testcontainers",
    "shakedown-macros/weaviate",
    "diagnostics",
]
# InfluxDB 2.x (`influxdb:2` via GenericImage; HTTP line protocol + Flux via reqwest only)
influxdb = [
    "dep:reqwest",
    "dep:testcontainers",
    "shakedown-macros/influxdb",
    "diagnostics",
]
# TimescaleDB (`timescale/timescaledb` via GenericImage; same wire protocol as Postgres)
timescaledb = [
    "dep:tokio-postgres",
    "dep:testcontainers",
    "shakedown-macros/timescaledb",
    "diagnostics",
]
# MCP server support (post-MVP, optional)
mcp = []
# Cluster topology — Docker network management and multi-node resources
cluster = ["dep:bollard"]
# Service-under-test: Docker-backed application containers in scenarios (opt-in)
# `diagnostics` enables bollard log/stats/events for labeled service containers.
services = ["dep:testcontainers", "dep:reqwest", "diagnostics"]
# Open-model load profiles, metrics, and scheduling
load = ["dep:hdrhistogram", "dep:base64"]

# LoadHandle open-model scheduling + event log merge (no Docker)
[[test]]
name = "load_handle"
path = "tests/load_handle.rs"
required-features = ["load"]

[[test]]
name = "load_performance_us008"
path = "tests/load_performance_us008.rs"
required-features = ["load"]

# Optional macro + Kafka Docker integration test; avoids compiling `resources = [Kafka]` without rdkafka
[[test]]
name = "macro_kafka"
path = "tests/macro_kafka.rs"
required-features = ["kafka"]

# Kafka typed helpers produce/consume integration (Docker); ignored unless --ignored
[[test]]
name = "helpers_kafka"
path = "tests/helpers_kafka.rs"
required-features = ["kafka"]

# RabbitMQ typed helpers publish/consume integration (Docker); ignored unless --ignored
[[test]]
name = "helpers_rabbit"
path = "tests/helpers_rabbit.rs"
