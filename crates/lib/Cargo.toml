[package]
name = "shakedown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Procedural macros (greeting smoke test; macros milestone will expand usage)
shakedown-macros = { path = "../macros" }

# Error handling and serialization
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
displaydoc = "0.2"

# Async runtime (public async lifecycle API)
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
async-trait = "0.1"

# Kafka integration (behind feature gate per D-2)
rdkafka = { version = "=0.38", optional = true, default-features = false, features = ["ssl-vendored"] }

# Testcontainers (base container runtime)
testcontainers = { version = "0.27", default-features = false, optional = true }

# Community images (enable per parent feature: `kafka`, `postgres`, …)
testcontainers-modules = { version = "0.15", default-features = false, optional = true }

# Async Postgres client for admin/readiness queries (no sqlx in public API)
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["runtime"] }

# Async MySQL/MariaDB protocol for admin/readiness queries (SPECS: no sqlx in public API)
mysql_async = { version = "0.36.1", optional = true }

# SQLite for in-memory per-scenario resources (no Docker; SPECS: rusqlite + spawn_blocking)
rusqlite = { version = "0.32", optional = true, default-features = false, features = ["bundled"] }

# Toxiproxy for fault injection (D-12 decision)
noxious-client = "1.0"

# Docker Engine API (read-only observability; feature `diagnostics`)
# Align with testcontainers' bollard to avoid duplicate bollard-stubs versions in the lockfile.
bollard = { version = "0.20", optional = true, default-features = false, features = ["ssl"] }

# Structured logging for diagnostics connection and future ShakedownLayer (SPECS §1)
tracing = "0.1"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
# Default: no heavy dependencies by default (unit tests work without Docker)
default = []
# Infrastructure diagnostics (bollard); implied by Docker-backed resource features unless `no-diagnostics` is set
diagnostics = ["dep:bollard"]
# Disables Docker socket diagnostics at compile time (stub APIs; no bollard client)
no-diagnostics = []
# Kafka integration with real infrastructure (requires Docker)
# Includes: rdkafka, testcontainers, diagnostics (bollard)
kafka = [
    "dep:rdkafka",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/kafka",
    "diagnostics",
]
# Postgres integration with real infrastructure (requires Docker)
postgres = [
    "dep:tokio-postgres",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/postgres",
    "diagnostics",
]
# MariaDB integration with real infrastructure (requires Docker)
mariadb = [
    "dep:mysql_async",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/mariadb",
    "diagnostics",
]
# Oracle MySQL integration with real infrastructure (requires Docker; distinct from MariaDB — R-8)
mysql = [
    "dep:mysql_async",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/mysql",
    "diagnostics",
]
# In-memory SQLite per scenario (no Docker)
sqlite = ["dep:rusqlite"]
# Outbox helpers (requires at least one relational feature)
outbox = []
# MCP server support (post-MVP, optional)
mcp = []

# Optional macro + Kafka runtime test (Docker); avoids compiling `resources = [Kafka]` without rdkafka
[[test]]
name = "macro_kafka"
path = "tests/macro_kafka.rs"
required-features = ["kafka"]

# Postgres suite + bindings (Docker); ignored unless --ignored
[[test]]
name = "postgres_vertical"
path = "tests/postgres_vertical.rs"
required-features = ["postgres"]

# MariaDB suite + bindings (Docker); ignored unless --ignored
[[test]]
name = "mariadb_vertical"
path = "tests/mariadb_vertical.rs"
required-features = ["mariadb"]

# Oracle MySQL suite + bindings (Docker); ignored unless --ignored
[[test]]
name = "mysql_vertical"
path = "tests/mysql_vertical.rs"
required-features = ["mysql"]

# SQLite bindings + in-memory proof (no Docker)
[[test]]
name = "sqlite_vertical"
path = "tests/sqlite_vertical.rs"
required-features = ["sqlite"]
