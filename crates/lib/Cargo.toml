[package]
name = "shakedown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Procedural macros (greeting smoke test; macros milestone will expand usage)
shakedown-macros = { path = "../macros" }

# Error handling and serialization
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
displaydoc = "0.2"

# Async runtime (public async lifecycle API)
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
async-trait = "0.1"

# Kafka integration (behind feature gate per D-2)
rdkafka = { version = "=0.38", optional = true, default-features = false, features = ["ssl-vendored"] }

# Testcontainers (base container runtime)
testcontainers = { version = "0.27", default-features = false, optional = true }

# Community images (enable per parent feature: `kafka`, `postgres`, …)
testcontainers-modules = { version = "0.15", default-features = false, optional = true }

# Async Postgres client for admin/readiness queries (no sqlx in public API)
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["runtime"] }

# Toxiproxy for fault injection (D-12 decision)
noxious-client = "1.0"

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }

[features]
# Default: no heavy dependencies by default (unit tests work without Docker)
default = []
# Kafka integration with real infrastructure (requires Docker)
# Includes: rdkafka, testcontainers
kafka = [
    "dep:rdkafka",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/kafka",
]
# Postgres integration with real infrastructure (requires Docker)
postgres = [
    "dep:tokio-postgres",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/postgres",
]
# MariaDB integration with real infrastructure (requires Docker)
# Includes: sqlx, testcontainers
mariadb = [
    "dep:sqlx",
    "dep:testcontainers",
]
# MCP server support (post-MVP, optional)
mcp = []

# Optional macro + Kafka runtime test (Docker); avoids compiling `resources = [Kafka]` without rdkafka
[[test]]
name = "macro_kafka"
path = "tests/macro_kafka.rs"
required-features = ["kafka"]

# Postgres suite + bindings (Docker); ignored unless --ignored
[[test]]
name = "postgres_vertical"
path = "tests/postgres_vertical.rs"
required-features = ["postgres"]

# SQLx for Postgres/MariaDB support
[dependencies.sqlx]
version = "0.8"
default-features = false
features = ["runtime-tokio-rustls", "postgres", "mysql"]
optional = true
