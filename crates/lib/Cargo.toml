[package]
name = "shakedown"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Procedural macros (greeting smoke test; macros milestone will expand usage)
shakedown-macros = { path = "../macros" }

# Error handling and serialization
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
displaydoc = "0.2"
time = { version = "0.3", default-features = false, features = ["formatting"] }

# Async runtime (public async lifecycle API)
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"

# Kafka integration (behind feature gate per D-2)
# `tokio` enables `FutureProducer` + `AsyncRuntime` (helpers and bridges use async send).
rdkafka = { version = "=0.38", optional = true, default-features = false, features = ["ssl-vendored", "tokio"] }

# Testcontainers (base container runtime)
testcontainers = { version = "0.27", default-features = false, optional = true }

# Community images (enable per parent feature: `kafka`, `postgres`, …)
testcontainers-modules = { version = "0.15", default-features = false, optional = true }

# Async Postgres client for admin/readiness queries (no sqlx in public API)
tokio-postgres = { version = "0.7", optional = true, default-features = false, features = ["runtime", "with-uuid-1", "with-time-0_3"] }

# Async MySQL/MariaDB protocol for admin/readiness queries (SPECS: no sqlx in public API)
mysql_async = { version = "0.36.1", optional = true }

# SQLite for in-memory per-scenario resources (no Docker; SPECS: rusqlite + spawn_blocking)
rusqlite = { version = "0.32", optional = true, default-features = false, features = ["bundled"] }

# RabbitMQ client for readiness and publication verification (`rabbitmq` feature)
lapin = { version = "4.3", optional = true }

# Toxiproxy control API for fault injection (D-12); enable via `fault-injection` (D-MVP-5)
noxious-client = { version = "1.0", optional = true }
# GET /version readiness for Toxiproxy (same major as noxious-client’s reqwest)
reqwest = { version = "0.11", optional = true, default-features = false, features = ["json", "rustls-tls"] }

# Docker Engine API (read-only observability; feature `diagnostics`)
# Align with testcontainers' bollard to avoid duplicate bollard-stubs versions in the lockfile.
bollard = { version = "0.20", optional = true, default-features = false, features = ["ssl"] }
# Stream combinators for bollard `/events` (diagnostics only)
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

# Structured logging for diagnostics connection and future ShakedownLayer (SPECS §1)
tracing = "0.1"

# HTTP bridges (MVP `mvp-bridges`; hyper 1.x + http 1.x per SPECS)
hyper = { version = "1", optional = true, default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", optional = true, default-features = false, features = ["tokio"] }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }
# gRPC bridges (optional; tonic aligns with lockfile via testcontainers stack)
tonic = { version = "0.14", optional = true, default-features = false, features = ["transport"] }
prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true, default-features = false }
tower = { version = "0.5", optional = true, default-features = false, features = ["util"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
bollard = { version = "0.20", default-features = false, features = ["ssl"] }
lapin = { version = "4.3" }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serial_test = "3"
time = { version = "0.3", default-features = false, features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Unary gRPC client for `bridge_grpc` integration test (no codegen; uses `tonic_prost::ProstCodec`).
http = "1"
prost = "0.14"
tonic = { version = "0.14", default-features = false, features = ["transport"] }
tonic-prost = "0.14"

[features]
# HTTP bridge types and `hyper` stack (default-on per `mvp-bridges` US-001)
default = ["bridges"]
bridges = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:http",
    "dep:http-body",
    "dep:http-body-util",
    "dep:bytes",
]
grpc-bridges = [
    "bridges",
    "dep:tonic",
    "dep:prost",
    "dep:tokio-stream",
    "dep:tower",
]
# Infrastructure diagnostics (bollard); implied by Docker-backed resource features unless `no-diagnostics` is set
diagnostics = ["dep:bollard", "dep:futures-util"]
# Disables Docker socket diagnostics at compile time (stub APIs; no bollard client)
no-diagnostics = []
# Kafka integration with real infrastructure (requires Docker)
# Includes: rdkafka, testcontainers, diagnostics (bollard)
kafka = [
    "dep:rdkafka",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/kafka",
    "diagnostics",
]
# Postgres integration with real infrastructure (requires Docker)
postgres = [
    "dep:tokio-postgres",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/postgres",
    "diagnostics",
]
# MariaDB integration with real infrastructure (requires Docker)
mariadb = [
    "dep:mysql_async",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/mariadb",
    "diagnostics",
]
# Oracle MySQL integration with real infrastructure (requires Docker; distinct from MariaDB — R-8)
mysql = [
    "dep:mysql_async",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/mysql",
    "diagnostics",
]
# In-memory SQLite per scenario (no Docker)
sqlite = ["dep:rusqlite"]
# Outbox helpers (requires at least one relational feature)
outbox = []
# RabbitMQ integration (Docker + lapin; aligns with kafka: diagnostics via testcontainers)
rabbitmq = [
    "dep:lapin",
    "dep:testcontainers",
    "dep:testcontainers-modules",
    "testcontainers-modules/rabbitmq",
    "diagnostics",
]
# Fault injection (Toxiproxy via testcontainers + noxious-client); composable with `kafka` etc.
fault-injection = [
    "dep:noxious-client",
    "dep:reqwest",
    "dep:testcontainers",
]
# MCP server support (post-MVP, optional)
mcp = []
# Service-under-test: Docker-backed application containers in scenarios (opt-in; see PRD service-under-test)
# `diagnostics` enables bollard log/stats/events for labeled service containers (US-010).
services = ["dep:testcontainers", "dep:reqwest", "diagnostics"]

# Optional macro + Kafka runtime test (Docker); avoids compiling `resources = [Kafka]` without rdkafka
[[test]]
name = "macro_kafka"
path = "tests/macro_kafka.rs"
required-features = ["kafka"]

# Kafka typed helpers produce/consume integration (Docker); ignored unless --ignored
[[test]]
name = "helpers_kafka"
path = "tests/helpers_kafka.rs"
required-features = ["kafka"]

# RabbitMQ typed helpers publish/consume integration (Docker); ignored unless --ignored
[[test]]
name = "helpers_rabbit"
path = "tests/helpers_rabbit.rs"
required-features = ["rabbitmq"]

# Postgres typed helpers execute/assert integration (Docker); ignored unless --ignored
[[test]]
name = "helpers_postgres"
path = "tests/helpers_postgres.rs"
required-features = ["postgres"]

# SQLite typed helpers execute/assert integration (no Docker)
[[test]]
name = "helpers_sqlite"
path = "tests/helpers_sqlite.rs"
required-features = ["sqlite"]

# Postgres suite + bindings (Docker); ignored unless --ignored
[[test]]
name = "postgres_vertical"
path = "tests/postgres_vertical.rs"
required-features = ["postgres"]

# MariaDB suite + bindings (Docker); ignored unless --ignored
[[test]]
name = "mariadb_vertical"
path = "tests/mariadb_vertical.rs"
required-features = ["mariadb"]

# Oracle MySQL suite + bindings (Docker); ignored unless --ignored
[[test]]
name = "mysql_vertical"
path = "tests/mysql_vertical.rs"
required-features = ["mysql"]

# Toxiproxy suite container + API readiness (Docker); ignored unless --ignored
[[test]]
name = "toxiproxy_vertical"
path = "tests/toxiproxy_vertical.rs"
required-features = ["fault-injection"]

# Kafka + Toxiproxy Faulty bootstrap / latency proof (Docker); ignored unless --ignored
[[test]]
name = "fault_injection_kafka"
path = "tests/fault_injection_kafka.rs"
required-features = ["kafka", "fault-injection"]

# SQLite bindings + in-memory proof (no Docker)
[[test]]
name = "sqlite_vertical"
path = "tests/sqlite_vertical.rs"
required-features = ["sqlite"]

# Infrastructure diagnostics (bollard log stream, Docker events, stats rings); Docker required
[[test]]
name = "diagnostics_integration"
path = "tests/diagnostics_integration.rs"
required-features = ["kafka"]

# Single-test process: run_scenario with Fake only + invalid DOCKER_HOST (no Docker needed)
[[test]]
name = "diagnostics_graceful"
path = "tests/diagnostics_graceful.rs"
required-features = ["kafka"]

# HTTP bridge server + Context (`bridges` is default; gate for no-default-features builds)
[[test]]
name = "bridge_http"
path = "tests/bridge_http.rs"
required-features = ["bridges"]

# gRPC stub bridge + tonic unary client (localhost only; `grpc-bridges`)
[[test]]
name = "bridge_grpc"
path = "tests/bridge_grpc.rs"
required-features = ["grpc-bridges"]

# Service container → host.docker.internal connectivity (Docker); ignored in test body
[[test]]
name = "service_host_resolution"
path = "tests/service_host_resolution.rs"
required-features = ["services"]

# Service-under-test GenericImage lifecycle (Docker); ignored unless --ignored
[[test]]
name = "services_lifecycle"
path = "tests/services_lifecycle.rs"
required-features = ["services"]

# Multi-service depends_on + inter-service env (Docker); ignored unless --ignored
[[test]]
name = "services_multi_dependency"
path = "tests/services_multi_dependency.rs"
required-features = ["services"]

# Service container labels + bollard diagnostics merge (Docker); ignored unless --ignored
[[test]]
name = "services_diagnostics"
path = "tests/services_diagnostics.rs"
required-features = ["services"]

# Postgres + RabbitMQ outbox + AMQP publication proof (Docker); no `kafka` feature
[[test]]
name = "outbox_rabbit"
path = "tests/outbox_rabbit.rs"
required-features = ["outbox", "postgres", "rabbitmq"]
