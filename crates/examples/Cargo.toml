[package]
name = "shakedown-examples"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Runnable adoption scenarios for the Shakedown framework."

[dependencies]
shakedown = { path = "../lib", default-features = false, features = [
    "kafka",
    "postgres",
    "mock-services",
    "services",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# Integration tests use `#[shakedown::test]` and `shakedown::Context` directly (not re-exported by this crate).
shakedown = { path = "../lib", default-features = false, features = [
    "kafka",
    "postgres",
    "mock-services",
    "services",
] }

# Names align with `shakedown` feature flags so callers can run:
# `cargo check -p shakedown-examples --example service_with_mock --features kafka,postgres,mock-services,services`
[features]
default = []
kafka = []
postgres = []
mock-services = []
services = []
