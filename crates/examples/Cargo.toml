[package]
name = "shakedown-examples"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Runnable adoption scenarios for the Shakedown framework."

[dependencies]
shakedown = { path = "../lib", default-features = false, features = [
    "kafka",
    "postgres",
    "mock-services",
    "services",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
serde_json = "1"

[dev-dependencies]
# Integration tests use `#[shakedown::test]` and `shakedown::Context` directly (not re-exported by this crate).
shakedown = { path = "../lib", default-features = false, features = [
    "kafka",
    "postgres",
    "mock-services",
    "services",
] }

# Marker features only: they keep documented `cargo … --features kafka,postgres,…` commands valid
# Cargo invocations and mirror `shakedown` flag names in README snippets. They do **not** toggle the
# path dependency — `shakedown` is already built with the needed features under `[dependencies]`
# above. Optional deps could wire these later; today they are documentation / CLI ergonomics.
[features]
default = []
kafka = []
postgres = []
mock-services = []
services = []
