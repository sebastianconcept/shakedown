syntax = "proto3";

package book.demo.v1;

// Second contract in the same shared crate: readers can add more `.proto` files here
// for other east/west calls without folding everything into the fulfillment package.
service Demo {
  rpc Ping(PingRequest) returns (PongResponse);
}

message PingRequest {
  string message = 1;
}

message PongResponse {
  string echo = 1;
}
