[package]
name = "shakedown-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Sebastian Sastre <sebastianconcept@gmail.com>"]
description = "Procedural macros for the Shakedown testing framework."
readme = "README.md"
repository = "https://github.com/sebastianconcept/shakedown"
homepage = "https://shakedown.dev/docs/guides/quick-start/"
documentation = "https://docs.rs/shakedown-macros"
license = "MIT"
keywords = ["proc-macro", "testing", "integration-testing", "shakedown"]
categories = ["development-tools::testing", "development-tools::procedural-macro-helpers"]
exclude = ["tests/**", "examples/**"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Kafka feature for resource expansions (enabled via shakedown crate when building with --features kafka)

[dev-dependencies]
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
shakedown = { path = "../lib" }

[features]
# Kafka integration feature (propagates to generated code in macros)
kafka = []
# Toxiproxy / fault-injection (propagates to generated code in macros)
fault-injection = []
# Elasticsearch (propagates to `resources = [Elasticsearch]`)
elasticsearch = []
# OpenSearch (propagates to `resources = [OpenSearch]`)
opensearch = []
# Qdrant (propagates to `resources = [Qdrant]`)
qdrant = []
# Weaviate (propagates to `resources = [Weaviate]`)
weaviate = []
# InfluxDB (propagates to `resources = [InfluxDb]`)
influxdb = []
# TimescaleDB (propagates to `resources = [Timescaledb]`)
timescaledb = []
# RabbitMQ integration feature (propagates to generated code in macros)
rabbitmq = []
# SQLite in-memory resource (propagates to generated code in macros)
sqlite = []
# MongoDB replica set cluster (propagates to `resources = [MongoReplicaSet]`)
mongodb-cluster = []
# Kafka KRaft multi-broker cluster (propagates to `resources = [KafkaCluster]`)
kafka-cluster = []
# Redis + Sentinel suite (propagates to `resources = [RedisSentinel]`)
redis-sentinel = []
# Postgres primary + replica cluster (propagates to `resources = [PostgresReplicaSet]`)
postgres-cluster = []
# RabbitMQ Erlang cluster (propagates to `resources = [RabbitCluster]`)
rabbitmq-cluster = []
