[package]
name = "shakedown-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# Kafka feature for resource expansions (enabled via shakedown crate when building with --features kafka)

[dev-dependencies]
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
shakedown = { path = "../lib" }

[features]
# Kafka integration feature (propagates to generated code in macros)
kafka = []
# SQLite in-memory resource (propagates to generated code in macros)
sqlite = []
