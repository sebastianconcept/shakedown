[package]
name = "shakedown-macros"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

[dev-dependencies]
trybuild = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
