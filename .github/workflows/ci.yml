name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check
        run: cargo check --workspace --all-features

      - name: Doc (docs.rs surface)
        run: cargo doc --all-features -p shakedown --no-deps

      - name: Test macros (trybuild)
        run: cargo test -p shakedown-macros

      - name: Test (services feature, no Docker)
        run: cargo test --features services -p shakedown

      - name: Kafka + mock service + whoami integration (Docker)
        run: >-
          cargo test -p shakedown --features kafka,services
          --test services_kafka_mock_service_whoami -- --ignored --test-threads=1

      - name: Postgres + multi-service integration (Docker)
        run: >-
          cargo test -p shakedown --features postgres,services
          --test services_multi_postgres_whoami -- --ignored --test-threads=1
