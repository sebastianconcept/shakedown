name: Release

# Publishes shakedown-macros then shakedown when a version tag is pushed.
# Requires repository secret CARGO_REGISTRY_TOKEN, or crates.io trusted publishing for this repo.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package smoke (no publish)
        run: |
          cargo package -p shakedown-macros --no-verify
          cargo package -p shakedown --no-verify

      - name: Publish shakedown-macros
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shakedown-macros --locked

      - name: Wait for crates.io index
        run: |
          version="$(awk -F '"' '/^version = / { print $2; exit }' crates/macros/Cargo.toml)"
          bash scripts/wait-for-crates-io-crate.sh shakedown-macros "$version"

      - name: Publish shakedown
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p shakedown --locked
