# Weekly (and on-demand) sweep of all crates/lib/tests/*_vertical.rs integration targets.
# Heavy: pulls many Docker images. Not run on every PR (see .github/workflows/ci.yml).

name: Resource smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  # `--all-features` links duckdb, rdkafka/openssl, aws-lc, etc. into every [[test]]
  # binary (~70). Parallel linking OOMs the 7GB ubuntu-latest runner; ld then dies
  # with SIGBUS (signal 7). Cap jobs and add swap below.
  CARGO_BUILD_JOBS: 2

jobs:
  vertical-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add swap (linker headroom)
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/lib

      - name: Check vertical [[test]] registrations
        run: bash scripts/check-vertical-tests-registered.sh

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: All vertical integration tests (Docker + ignored)
        run: >-
          cargo nextest run -p shakedown --all-features
          -E 'binary(/vertical/)'
          --run-ignored all
